name: Refit Wave Calibrations

# Quarterly MONITOR for the per-location waveHeightCalibration factors in
# src/app/lib/locations.ts.
#
# This is deliberately not a refit trigger. The two-year study in scripts/
# calibration-seasonality.ts showed the factors drift only 3-7% year over year, so
# re-deriving them quarterly would chase noise. What this catches instead is the stuff
# that breaks without warning: a decommissioned buoy, a station that stopped reporting
# WVHT, or a genuine regime change at one site.
#
# Note the tool it runs works on a <=45 day window, which is too short to *set* a factor
# — a short window encodes whichever season it lands in, which is exactly how the
# previous generation of factors ended up wrong. Replacement values come from
# `pnpm calibration-seasonality --recommend` over full years. The issue body says so.
#
# It never edits locations.ts.

on:
  schedule:
    - cron: '0 13 1 3,6,9,12 *' # 1st of Mar/Jun/Sep/Dec, 13:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Window length in days (7-45)'
        required: false
        default: '30'

permissions:
  contents: read
  issues: write

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run refit
        id: refit
        run: |
          # NDBC and Open-Meteo are both public and occasionally flaky. Capture whatever
          # the script produces so the issue still gets opened and says what went wrong.
          set +e
          pnpm refit-calibration --days "${{ inputs.days || '30' }}" > refit-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat refit-output.txt

      - name: Open refit issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.refit.outputs.exit_code }}
        run: |
          QUARTER="Q$(( ($(date -u +%-m) - 1) / 3 + 1 )) $(date -u +%Y)"

          {
            echo "Quarterly health check on the wave height calibration factors in"
            echo "\`src/app/lib/locations.ts\`. This is ${QUARTER}."
            echo ""
            echo "**This is a monitor, not a refit.** The factors drift only 3-7% year over"
            echo "year, so a flag here usually means something broke — a dead buoy, a station"
            echo "that stopped reporting \`WVHT\` — rather than that a factor needs updating."
            echo ""

            if [ "$EXIT_CODE" != "0" ]; then
              echo "> [!WARNING]"
              echo "> The refit script exited \`${EXIT_CODE}\`. Output below may be incomplete."
              echo ""
            fi

            echo '```'
            cat refit-output.txt
            echo '```'
            echo ""
            echo "## What to do"
            echo ""
            echo "**If a location errored** (dead or silent buoy) that is the real finding."
            echo "Pick a replacement station and update \`calibrationBuoyId\`."
            echo ""
            echo "**If a location is flagged \`* drifted\`**, do not paste the suggested number."
            echo "This tool fits on a \`<=45\` day window, which encodes whichever season it lands"
            echo "in — that is exactly how the previous factors ended up wrong. Instead:"
            echo ""
            echo "1. \`pnpm calibration-seasonality --location <slug> --validate --recommend\`"
            echo "2. Compare schemes out of sample. Apply a factor only if it beats no"
            echo "   correction; pin it to \`1.00\` if it does not."
            echo "3. Update \`waveHeightCalibration\`, \`calibrationFittedOn\`, \`calibrationWindow\`"
            echo "   and the fit comment together."
            echo "4. Re-run \`pnpm test\`."
            echo ""
            echo "**Nothing flagged and no errors?** Close this issue."
            echo ""
            echo "Background: the \"Wave height calibration\" section of \`CLAUDE.md\`."
            echo ""
            echo "<sub>Opened automatically by \`.github/workflows/refit-calibration.yml\`.</sub>"
          } > issue-body.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Refit wave height calibrations — ${QUARTER}" \
            --body-file issue-body.md
